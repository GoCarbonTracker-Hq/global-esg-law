# Runs the tests and the two corpus checks from MAINTAINING.md on every pull request and on main.
# Reads only: it pushes nothing and needs no secrets.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Tests
        run: python -m pytest tests -q
      - name: Corpus check
        run: python tools/check_corpus.py | tail -n 5
        shell: bash -eo pipefail {0}
      - name: Publish gate
        run: python tools/publish_gate.py > gate.log || (tail -n 60 gate.log; exit 1)
