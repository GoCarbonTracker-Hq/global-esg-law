# Source watcher: runs tools/watch.py once per cadence tier and uploads each tier's queue and seen state as an artifact.
# Manual only until the ceiling in upkeep/README.md ("Cadence and ceiling") is agreed and the schedule enabled.
# Opens no pull request and pushes nothing; the rows are reviewed and committed by a person.
name: watch

on:
  workflow_dispatch:
  # Weekly, the gazette_feed interval in upkeep/cadence.json (Mondays 06:17 UTC). Enable only after the ceiling is set.
  # schedule:
  #   - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minutes is the limit on the watch step alone, so the upload below still runs when the step is cut off;
        # watch.py writes seen.json and queue.csv as it goes, so a cut-off step keeps the watchers it had read.
        # The one-run seconds per tier are in upkeep/cadence.json (per_tier).
        include:
          - tier: gazette_feed
            minutes: 10
          - tier: consolidation_site
            minutes: 45
          - tier: regulator_page
            minutes: 45
          - tier: tracker_pointer
            minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the watchers
        timeout-minutes: ${{ matrix.minutes }}
        # Exit 3 is "finished, some sources unreachable" (the CARB, India Code and SEBI hosts refuse this runner's
        # address on every run); it does not fail the job. Any other exit code does.
        run: python3 tools/watch.py --tier ${{ matrix.tier }} || [ $? -eq 3 ]
      - name: Upload queue and seen state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upkeep-${{ github.run_id }}-${{ matrix.tier }}
          path: |
            upkeep/queue.csv
            upkeep/seen.json
          if-no-files-found: error
